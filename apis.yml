aid: pramaana-labs
name: Pramaana Labs
description: 'Pramaana Labs is a frontier AI research lab building the verification
  layer for high-stakes, mission-critical AI. The company turns complex human knowledge
  - tax codes, clinical guidelines, legal rules, and safety constraints - into machine-checkable
  logic, so that every AI answer can be traced, challenged, and proved rather than
  merely sounding plausible. Its stack compiles domain rules into formal systems that
  return proofs, counterexamples, and traceable explanations. Pramaana Labs raised
  $27M to build a compiler for mission-critical AI and is backed by Accel. At this
  time the company operates as a research lab with published work (RuleArena, arXiv)
  and no public developer API surface.'
